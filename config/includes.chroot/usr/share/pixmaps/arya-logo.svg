<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f2c"/>
      <stop offset="1" stop-color="#241150"/>
    </linearGradient>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22e5ff"/>
      <stop offset="1" stop-color="#a468ff"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a468ff" stop-opacity=".2"/>
      <stop offset=".5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#22e5ff" stop-opacity=".2"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".4" r=".6">
      <stop offset="0" stop-color="#6a3dff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#6a3dff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>

  <g fill="#ffffff">
    <circle cx="70" cy="90" r="2.5" opacity=".9"/>
    <circle cx="140" cy="48" r="1.8" opacity=".6"/>
    <circle cx="430" cy="80" r="2.6" opacity=".9"/>
    <circle cx="465" cy="190" r="1.6" opacity=".6"/>
    <circle cx="52" cy="250" r="1.8" opacity=".7"/>
    <circle cx="455" cy="430" r="2.2" opacity=".8"/>
    <circle cx="90" cy="440" r="1.8" opacity=".6"/>
    <circle cx="380" cy="40" r="1.4" opacity=".6"/>
  </g>

  <!-- orbit, back half -->
  <g transform="rotate(-18 256 300)" fill="none" stroke="url(#ring)" stroke-width="7" stroke-linecap="round">
    <path d="M100 300 A156 42 0 0 1 412 300" opacity=".45"/>
  </g>

  <!-- glow under A -->
  <path d="M160 392 L256 142 L352 392" fill="none" stroke="url(#a)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)" opacity=".6"/>

  <!-- letter A -->
  <path d="M160 392 L256 142 L352 392" fill="none" stroke="url(#a)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- orbit, front half -->
  <g transform="rotate(-18 256 300)" fill="none" stroke="url(#ring)" stroke-width="7" stroke-linecap="round">
    <path d="M100 300 A156 42 0 0 0 412 300"/>
  </g>

  <!-- planet dot on orbit -->
  <circle cx="392" cy="262" r="11" fill="#ffffff"/>
  <circle cx="392" cy="262" r="20" fill="#22e5ff" opacity=".25"/>

  <!-- star at the peak -->
  <path d="M256 78 L263 112 L297 119 L263 126 L256 160 L249 126 L215 119 L249 112 Z" fill="#ffffff"/>
</svg>
